<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT NAME — Jonty Ali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&family=DM+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../project.css">
</head>
<body>

  <canvas id="bg-stars-canvas"></canvas>
  <div class="noise"></div>

  <crt-overlay></crt-overlay>

  <site-nav></site-nav>

  <div class="project-hero">
    <div class="project-status">STATUS</div>
    <div class="hero-title-row">
      <img src="icon.png" class="hero-icon" alt="" aria-hidden="true"
           onerror="this.style.display='none'">
      <h1>PROJECT NAME</h1>
    </div>
    <p class="lead">
      Short description of the project.
    </p>
  </div>

  <div class="project-meta">
    <div class="meta-item">
      <span class="meta-label">status</span>
      <span class="meta-value">STATUS</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">language</span>
      <span class="meta-value">LANGUAGE</span>
    </div>
  </div>

  <div class="gallery-section">
    <div class="section-label">// gallery</div>
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="carousel-track"></div>
      <button class="carousel-btn carousel-prev" id="prev" aria-label="previous">&#8249;</button>
      <button class="carousel-btn carousel-next" id="next" aria-label="next">&#8250;</button>
      <div class="carousel-dots" id="dots"></div>
    </div>
    <div class="gallery-placeholder-msg" id="gallery-placeholder">
      <div class="gallery-placeholder-grid">
        <div class="gallery-item"><div class="gallery-placeholder">screenshot coming soon</div></div>
        <div class="gallery-item"><div class="gallery-placeholder">screenshot coming soon</div></div>
        <div class="gallery-item"><div class="gallery-placeholder">screenshot coming soon</div></div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lb-close" aria-label="close">✕</button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="docs-section">
    <div class="section-label">// about</div>

    <div class="doc-block">
      <h3>Overview</h3>
      <p>Write something here.</p>
    </div>
  </div>

  <site-footer></site-footer>

  <script src="../../bg-stars.js"></script>
  <script src="../../components.js"></script>
  <script src="../project.js"></script>

</body>
</html>
