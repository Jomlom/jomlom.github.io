body{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  cursor:url('cursor.png') 0 0, auto;
}
a,button,.crt-item{cursor:url('cursor.png') 0 0, auto}

.hero{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:row;justify-content:flex-start;overflow:hidden}

/* CRT panel — floating text, no box */
.crt-panel{
  position:relative;z-index:2;width:50%;min-width:420px;
  display:flex;flex-direction:column;justify-content:center;
  padding:5rem 5rem;
}

.crt-panel .crt-name{
  font-family:var(--font-crt);font-size:8.5rem;line-height:0.9;color:#ffffff;
  letter-spacing:0.02em;margin-bottom:0.4rem;opacity:1;animation:none;
  text-shadow:var(--glow-white);
}
.crt-tag{
  font-family:var(--font-crt);font-size:1.7rem;color:var(--text-muted);
  margin-bottom:2.2rem;letter-spacing:0.03em;
  text-shadow:var(--glow-muted);
}

.crt-menu{list-style:none;position:static;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:0.15rem;padding:0;border:0;background:none;backdrop-filter:none}

@media (max-width:900px){
  .hero{flex-direction:column}
  #hero-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0.45}
  .crt-panel{width:100%;min-width:0;padding:5rem 1.5rem 3rem;justify-content:flex-start}
  .crt-item{width:18rem}
}

<body>

<span class="key">&uarr;&darr;</span> navigate <span class="key">&crarr;</span> select
    </div>
  </div>

  <crt-overlay rollbar></crt-overlay>
</section>

<script src="../hero-sim.js"></script>
<script src="../bg-stars.js"></script>
<script>

// ---- type out the name, then drop the caret cleanly (no blink) ----
(function(){
  const target = 'JONTY ALI'
  const el = document.getElementById('name-text')
  const caret = document.getElementById('name-caret')
  const hint = document.getElementById('crt-hint')
  let i = 0
  setTimeout(function step(){
    if(i <= target.length){
      el.textContent = target.slice(0, i)
      i++
      setTimeout(step, 50)
    } else {
      caret.classList.add('gone')
      if(hint) hint.classList.add('show')
    }
  }, 430)
})();

// ---- menu navigation: arrows + WS + numbers + mouse ----
const items = Array.from(document.querySelectorAll('.crt-item'))
let sel = 0
function setSel(i){ sel=(i+items.length)%items.length; items.forEach((it,idx)=>it.classList.toggle('selected',idx===sel)) }
items.forEach((it,idx)=>it.addEventListener('mouseenter',()=>setSel(idx)))
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase()
  if(k==='arrowdown'||k==='s'){e.preventDefault();setSel(sel+1)}
  else if(k==='arrowup'||k==='w'){e.preventDefault();setSel(sel-1)}
  else if(k==='enter'||k===' '){e.preventDefault();items[sel].click()}
  else if(k>='1' && k<='9'){const n=parseInt(k,10)-1; if(n<items.length){e.preventDefault();setSel(n);items[n].click()}}
})
</script>
<script src="../components.js"></script>
